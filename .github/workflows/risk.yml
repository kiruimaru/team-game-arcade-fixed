name: Risk checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p build
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/risk_tests.cpp -o build/risk-tests
          ./build/risk-tests
